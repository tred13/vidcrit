# Used with: luanti --config ~/skit.conf  (client + integrated singleplayer server)

# ---- window / rendering: exactly the Xvfb screen, portrait 9:16
fullscreen = true
screen_w = 720
screen_h = 1280
vsync = false
fps_max = 30
fps_max_unfocused = 30
viewing_range = 60
enable_fog = true
smooth_lighting = true
enable_clouds = false
enable_minimap = false
enable_waving_water = false
enable_waving_leaves = false
enable_waving_plants = false
enable_particles = true
enable_sound = false
touch_controls = false
language = en

# ---- keep everything off the picture
node_highlighting = none
show_debug = false
console_alpha = 0
show_nametag_backgrounds = false
view_bobbing_amount = 0
arm_inertia = false
cinematic = false

# ---- server side (integrated)
creative_mode = true
enable_damage = false
time_speed = 0
mobs_spawn = false
only_peaceful_mobs = true
dedicated_server_step = 0.033
max_block_generate_distance = 8
max_block_send_distance = 8
server_announce = false
enable_client_modding = false
