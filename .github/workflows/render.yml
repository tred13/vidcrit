name: render-video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = voice + music + render | preview = stills only (fast, no TTS)"
        default: full
        type: choice
        options: [full, preview]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System packages (ffmpeg + headless Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Base python deps
        run: pip install numpy

      - name: Node deps
        working-directory: video
        run: npm ci

      - name: Download real music, SFX and Twemoji
        run: python scripts/fetch_assets.py

      # ---------------------------------------------------------------- PREVIEW
      - name: Preview timings (no TTS)
        if: inputs.mode == 'preview'
        run: python scripts/tts.py --estimate

      - name: Preview stills
        if: inputs.mode == 'preview'
        working-directory: video
        run: |
          mkdir -p ../out/stills
          node -e "const t=require('./src/timing.json');const f=[];t.scenes.forEach(s=>{f.push(Math.round((s.start+0.35)*30));f.push(Math.round((s.start+(s.end-s.start)*0.8)*30));});f.push(Math.round((t.total-1.5)*30));console.log(f.join(' '))" > /tmp/frames.txt
          for f in $(cat /tmp/frames.txt); do
            npx remotion still src/index.ts Main ../out/stills/f$(printf %05d $f).jpg --frame=$f --image-format=jpeg --jpeg-quality=85 || exit 1
          done

      # ------------------------------------------------------------------- FULL
      - name: Cache Hugging Face models
        if: inputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-whisper-v1

      - name: Python deps (Chatterbox TTS, CPU)
        if: inputs.mode == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper

      - name: Narration (Chatterbox) + word timings
        if: inputs.mode == 'full'
        run: python scripts/tts.py

      - name: Mix voice + music + SFX
        if: inputs.mode == 'full'
        run: python scripts/mix.py

      - name: Render 1080x1920 @ 30fps
        if: inputs.mode == 'full'
        working-directory: video
        run: |
          mkdir -p ../out
          npx remotion render src/index.ts Main ../build/silent.mp4 --codec=h264 --crf=16 --pixel-format=yuv420p --concurrency=4 --log=info

      - name: Mux audio
        if: inputs.mode == 'full'
        run: |
          ffmpeg -y -i build/silent.mp4 -i build/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -ar 48000 -shortest -movflags +faststart out/vidcrit_greenland.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate,channels,duration -of default=nw=1 out/vidcrit_greenland.mp4
          cp build/voice.wav out/voice.wav
          cp video/src/timing.json out/timing.json
          ffmpeg -y -i out/vidcrit_greenland.mp4 -vf "fps=0.5,scale=216:-1,tile=8x4" -frames:v 1 out/contact_sheet.jpg

      - name: Publish release
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" out/vidcrit_greenland.mp4 out/contact_sheet.jpg \
            --title "Greenland explainer #${{ github.run_number }}" --notes "1080x1920, 30fps, English, Chatterbox voice."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidcrit-output
          path: out
          retention-days: 14
