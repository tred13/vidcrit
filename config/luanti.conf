# Headless 720x1280 capture profile (Xvfb :99, llvmpipe)
fullscreen = true
screen_w = 720
screen_h = 1280
vsync = false
fps_max = 60
fps_max_unfocused = 60
pause_on_lost_focus = false
video_driver = opengl
enable_sound = false
show_debug = false
enable_clouds = false
enable_fog = true
viewing_range = 50
fov = 72
smooth_lighting = true
enable_particles = true
node_highlighting = none
view_bobbing_amount = 0
enable_minimap = false
hud_scaling = 1
chat_log_level = none
server_announce = false
language = en

# Server / game behaviour
time_speed = 0
dedicated_server_step = 0.03
creative_mode = true
enable_damage = true
max_block_send_distance = 8

# VoxeLibre switches
mcl_doWeatherCycle = false
mcl_enable_hunger = false
mcl_game_music = false
vl_cavesounds = false
mcl_showDeathMessages = false
mcl_showAdvancementMessages = false
mcl_logging_structures = false
